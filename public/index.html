<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[ Website Name ] — Hospital Management System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ── LOGIN ─────────────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🏥</div>
    <h1>[ Website Name ]</h1>
    <p>Hospital Management System — LAN Edition</p>

    <label for="username">Username</label>
    <input id="username" type="text" placeholder="Enter username" autocomplete="off">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter password">

    <button class="btn-primary" id="login-btn">Sign In</button>
    <div class="login-error" id="login-error"></div>

    <div class="demo-hint">
      <strong>Demo Credentials</strong>
      admin / admin123 &nbsp;·&nbsp; doctor / doctor123 &nbsp;·&nbsp; nurse / nurse123
    </div>
  </div>
</div>

<!-- ── APP SHELL ──────────────────────────────────────────────────────── -->
<div id="app">

  <!-- [ Navigation Bar Component ] -->
  <nav class="navbar">
    <div class="navbar-brand">
      <span class="icon">🏥</span>
      [ Website Name ]
    </div>
    <div class="navbar-right">
      <span class="server-time" id="clock"></span>
      <span class="navbar-user" id="user-name">—</span>
      <span class="role-pill" id="role-pill">—</span>
      <button class="btn-logout" id="logout-btn">Sign Out</button>
    </div>
  </nav>

  <!-- Sidebar — items injected by JS based on role -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- Main content -->
  <main class="main" id="main-content"></main>
</div>

<!-- ── SHARED MODAL ───────────────────────────────────────────────────── -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">—</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
