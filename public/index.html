<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[ Website Name ] — Hospital Management System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ─── Login ─────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🏥</div>
    <h1>[ Website Name ]</h1>
    <p class="subtitle">Hospital Management System</p>
    <label for="username">Username</label>
    <input id="username" type="text" placeholder="e.g. nurse" autocomplete="off">
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="••••••••">
    <button class="btn-primary" id="login-btn">Sign In</button>
    <div class="login-error" id="login-error"></div>
    <div class="demo-hint">
      <strong>Demo Accounts</strong>
      <div class="creds">admin / admin123</div>
      <div class="creds">doctor / doctor123</div>
      <div class="creds">nurse / nurse123</div>
    </div>
  </div>
</div>

<!-- ─── App shell (icon rail + section nav + topbar + main) ───── -->
<div id="app">
  <div class="shell">

    <!-- Far-left icon rail -->
    <aside class="rail" id="rail">
      <div class="rail-brand">🏥</div>
      <div id="rail-items"></div>
      <div class="rail-spacer"></div>
      <div class="rail-avatar" id="rail-avatar">?</div>
    </aside>

    <!-- Section sidebar (sub-navigation) -->
    <aside class="section-nav" id="section-nav">
      <div class="section-head">
        <h2 id="section-title">Dashboard</h2>
        <div class="sub" id="section-sub">Overview</div>
      </div>
      <div class="section-body" id="section-items"></div>
      <div class="section-foot">
        <div class="rail-avatar" id="foot-avatar" style="width:30px;height:30px;font-size:11px;margin:0">?</div>
        <div class="who">
          <div class="nm" id="user-name">—</div>
          <div class="em" id="user-role">—</div>
        </div>
        <button class="icon-btn" id="logout-btn" title="Sign out">⎋</button>
      </div>
    </aside>

    <!-- Right column: topbar + main -->
    <div class="main-wrap">
      <div class="topbar">
        <button class="hamb" title="Toggle menu">≡</button>
        <div class="search-wrap">
          <input id="global-search-input" type="text" placeholder="Search patients, inventory, queue…">
        </div>
        <div class="topbar-right">
          <span class="clock" id="clock">—</span>
          <button class="action-btn" title="Toggle fullscreen" id="fs-btn">⛶</button>
          <button class="action-btn" title="Profile">
            <div class="avatar" id="top-avatar">?</div>
          </button>
        </div>
      </div>
      <main class="main" id="main-content"></main>
    </div>

  </div>
</div>

<!-- Toast host -->
<div id="toast-host"></div>

<!-- Shared modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">—</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
