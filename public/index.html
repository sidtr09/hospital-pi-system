<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[ Website Name ] — Hospital Management System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ─── Login ───────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M3 7v14M21 7v14M6 21V11a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v10M9 6V3h6v3M12 10v6M9 13h6"/></svg>
    </div>
    <h1>[ Website Name ]</h1>
    <p class="subtitle">Hospital Management System</p>

    <label for="username">Username</label>
    <input id="username" type="text" placeholder="e.g. nurse" autocomplete="off">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="••••••••">

    <button class="btn-primary" id="login-btn">Sign In</button>
    <div class="login-error" id="login-error"></div>

    <div class="demo-hint">
      <strong>Demo Accounts</strong>
      <div class="creds">admin / admin123</div>
      <div class="creds">doctor / doctor123</div>
      <div class="creds">nurse / nurse123</div>
    </div>
  </div>
</div>

<!-- ─── App Shell ───────────────────────────────────────────── -->
<div id="app">

  <nav class="navbar">
    <div class="navbar-brand">
      <span class="brand-mark">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M3 7v14M21 7v14M6 21V11a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v10M9 6V3h6v3M12 10v6M9 13h6"/></svg>
      </span>
      [ Website Name ]
    </div>
    <div class="navbar-right">
      <div class="global-search">
        <input id="global-search-input" placeholder="Search patients…" type="text">
        <span class="kbd">/</span>
      </div>
      <span class="clock" id="clock"></span>
      <div class="user-chip">
        <span class="avatar" id="user-avatar">A</span>
        <div class="meta">
          <div class="name" id="user-name">—</div>
          <div class="role" id="user-role">—</div>
        </div>
      </div>
      <button class="btn-logout" id="logout-btn">Sign out</button>
    </div>
  </nav>

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main" id="main-content"></main>
</div>

<!-- ─── Toast host ──────────────────────────────────────────── -->
<div id="toast-host"></div>

<!-- ─── Shared Modal ────────────────────────────────────────── -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">—</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
